# Build from this fork. Do not replace the build with the upstream :latest image.
# Coolify sets --project-directory to the repository root. For local Compose,
# also pass --project-directory . from the repository root.
services:
  sub2api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: https://proxy.golang.org,direct
        GOSUMDB: sum.golang.org
    restart: unless-stopped
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - personal_config:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      TZ: Europe/Kyiv
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY}
      SECURITY_URL_ALLOWLIST_ENABLED: "true"
      SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS: api.openai.com,chatgpt.com,auth.openai.com
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: "false"
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - private
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: sub2api
      POSTGRES_DB: sub2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - personal_database:/var/lib/postgresql/data
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_messages=fatal", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length_on_error=0"]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      core: 0
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDISCLI_AUTH\""]
    tmpfs:
      - /data:rw,nosuid,nodev,noexec,size=16m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      core: 0
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  personal_config:
  personal_database:

networks:
  private:
    internal: true
